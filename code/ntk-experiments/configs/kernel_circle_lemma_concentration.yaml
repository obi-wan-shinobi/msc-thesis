experiment:
  name: kernel_circle_lemma_concentration
  save_dir: results
  seed: 0

data:
  n_trains: [
      64,
      128,
      256,
      512,
      1024,
      2048,
      4096,
      8192,
      16384,
      # 32768,
      # 65536,
      # 131072,
      # 262144,
    ]
  n_eval: 720
  noise_std: 0.0

basis:
  K_max: 10

target:
  Ks: [0, 1, 2, 3]
  amps: [1.0, 0.9, 0.5, 0.35]
  phases: [0.0, 0.0, 0.0, 0.0]

kernel:
  name: bias

train:
  # Kept for compatibility with the validation script interface.
  # These are ignored when run_dynamics is false.
  steps: 0
  eta: null
  eta_scale: 0.05
  save_every: 100
  run_dynamics: false

sweep:
  # 100+ seeds for concentration estimates. Interpreted as
  # seeds experiment.seed + 0,1,...,127.
  seeds: 100

analysis:
  mode_compare: [0, 1, 2, 3, 4, 5]

artifacts:
  # Save only compact lemma metrics/mode summaries.
  save_full_matrices: false
