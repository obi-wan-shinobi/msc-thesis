experiment:
  name: ntk_frozen_vs_evolving_mode_dynamics_w256
  save_dir: results
  seed: 0

data:
  n_train: 1024
  n_eval: 1024
  train_grid: equally_spaced
  noise_std: 0.0

target:
  Ks: [0, 2, 5, 6, 11, 12]
  amps: [1.0, 0.8, 0.55, 0.55, 0.55, 0.55]
  phases: [0.0, 0.0, 1.57079632679, 1.57079632679, 0.0, 0.0] # keep pi/2 on two components (k=5,6)

model:
  depth_hidden: 1
  parameterization: ntk
  b_std: 1.0

train:
  steps: 20000
  lr: 0.000390625 # LS-consistent scale (~0.2 * 2 / n_train with n_train=1024)
  log_every: 500
  eval_every: 100 # denser snapshots for early-time mode dynamics

sweep:
  widths: [256]
  seeds: 5

frozen:
  eta: null
  eta_scale: 0.05

analysis:
  tracked_freqs: [0, 2, 5, 6, 11, 12]
  plane_freqs: [2, 5, 6, 11, 12]

artifacts:
  save_eval_predictions: true
